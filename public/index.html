<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>印刷拼版系统</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>印刷拼版系统</h1>
    <div id="saveState" class="save-state" title="状态保存在服务器，关闭页面再回来可续排">未连接</div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section class="panel">
        <h2>纸张参数</h2>
        <div class="form-grid">
          <label>纸张宽 (mm)
            <input id="specPaperW" type="number" min="1" step="0.5">
          </label>
          <label>纸张高 (mm)
            <input id="specPaperH" type="number" min="1" step="0.5">
          </label>
          <label>咬口宽 (mm)
            <input id="specGripper" type="number" min="0" step="0.5">
          </label>
          <label>出血边 (mm)
            <input id="specBleed" type="number" min="0" step="0.5">
          </label>
          <label>件间留边 (mm)
            <input id="specGap" type="number" min="0" step="0.5">
          </label>
          <label>咬口位置
            <select id="specEdge">
              <option value="bottom">下边（传动侧）</option>
              <option value="top">上边</option>
              <option value="left">左边</option>
              <option value="right">右边</option>
            </select>
          </label>
        </div>
        <p id="specHint" class="hint"></p>
      </section>

      <section class="panel">
        <h2>新增成品件</h2>
        <div class="form-grid">
          <label class="span2">名称
            <input id="newName" type="text" placeholder="如：宣传页 A">
          </label>
          <label>开数
            <input id="newK" type="number" min="1" step="1" list="kList">
            <datalist id="kList">
              <option value="2"><option value="4"><option value="8">
              <option value="16"><option value="32"><option value="64">
            </datalist>
          </label>
          <label>数量
            <input id="newQty" type="number" min="1" step="1" value="1">
          </label>
          <label>成品宽 (mm)
            <input id="newW" type="number" min="0.1" step="0.1">
          </label>
          <label>成品高 (mm)
            <input id="newH" type="number" min="0.1" step="0.1">
          </label>
        </div>
        <button id="btnAddItem" class="primary">加入待排清单</button>
        <p class="hint">成品尺寸 / 开数缺一项时不能上纸。</p>
      </section>

      <section class="panel">
        <h2>待排清单 <span id="poolCount" class="count"></span></h2>
        <ul id="itemPool" class="item-pool"></ul>
      </section>
    </aside>

    <section class="workarea">
      <nav class="sheet-tabs" id="sheetTabs"></nav>
      <div class="canvas-toolbar">
        <button id="btnAutoPack" class="primary">一键自动拼版</button>
        <button id="btnAddSheet">加一张纸</button>
        <span id="sheetBadge" class="sheet-badge"></span>
      </div>
      <div id="canvasScroll" class="canvas-scroll">
        <div id="canvas" class="canvas"></div>
      </div>
      <div id="sheetLegend" class="legend"></div>
    </section>
  </main>

  <div id="draftBanner" class="draft-banner hidden">
    <span id="draftText"></span>
    <button id="btnDraftResume">接着摆</button>
    <button id="btnDraftCommit">确认落版</button>
    <button id="btnDraftDiscard" class="danger">放弃该件</button>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/imposition.js"></script>
  <script src="/app.js"></script>
</body>
</html>
